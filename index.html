<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXL Express | Under Construction</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ffcc00,#ffd633);
  text-align:center;
  color:#111;
}

.container{
  background:white;
  padding:50px 30px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  max-width:400px;
  width:90%;
}

.logo{
  font-size:26px;
  font-weight:700;
  color:#d40511;
  margin-bottom:20px;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

p{
  font-size:14px;
  margin-bottom:20px;
  color:#555;
}

.loader{
  border:5px solid #eee;
  border-top:5px solid #d40511;
  border-radius:50%;
  width:50px;
  height:50px;
  margin:20px auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.footer{
  margin-top:20px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">DXL Express</div>

  <h1>🚧 Under Construction</h1>
  <p>We are working hard to launch our new global shipping platform. Please check back soon.</p>

  <div class="loader"></div>

  <div class="footer">
    © 2026 DXL Express
  </div>
</div>

</body>
</html>
